name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The metric tests only need pandas and pytest, not the notebook stack.
      - run: pip install "pandas==2.3.3" "pytest==9.1.1"
      - run: pytest -q
